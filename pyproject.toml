[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "shax"
version = "0.0.1"
description = "A NumPy-backed shim for JAX code on platforms without jaxlib"
readme = "README.md"
# shax and the ported JAX code are Apache-2.0; vendored opt_einsum is MIT.
license = "Apache-2.0 AND MIT"
license-files = ["LICENSE", "shax/jax/_src/LICENSE-JAX", "shax/_vendor/opt_einsum/LICENSE"]
requires-python = ">=3.12"
dependencies = ["numpy", "ml_dtypes>=0.5.0"]

[project.optional-dependencies]
scipy = ["scipy"]

[tool.hatch.build.targets.wheel]
packages = ["shax"]
